name: Build LVLIBP with Windows Docker

on:
  push:
    branches:
      - main
      - develop
      - release-alpha/*
      - release-beta/*
      - release-rc/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - develop
      - release-alpha/*
      - release-beta/*
      - release-rc/*
      - hotfix/*
  workflow_dispatch:

jobs:
  build-lvlibp:
    name: Build LabVIEW Packed Library (Windows)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for commit info

      - name: Extract version from package.json
        id: version
        shell: pwsh
        run: |
          $packageJson = Get-Content package.json | ConvertFrom-Json
          $version = $packageJson.version
          $parts = $version -split '\.'
          "major=$($parts[0])" >> $env:GITHUB_OUTPUT
          "minor=$($parts[1])" >> $env:GITHUB_OUTPUT
          "patch=$($parts[2])" >> $env:GITHUB_OUTPUT
          "build=${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Build PPL with Windows Docker
        uses: KSharma-NI/open-source/build-lvlibp-docker-windows@users/krishsha/build-lvlibp-docker
        with:
          minimum_supported_lv_version: '2026'
          supported_bitness: '64'
          project_path: 'lv_icon_editor.lvproj'
          target_name: 'My Computer'
          build_spec_name: 'Editor Packed Library'
          major: ${{ steps.version.outputs.major }}
          minor: ${{ steps.version.outputs.minor }}
          patch: ${{ steps.version.outputs.patch }}
          build: ${{ steps.version.outputs.build }}
          commit: ${{ github.sha }}
          docker_image: 'nationalinstruments/labview'
          image_tag: '2026-windows'
          log_level: 'INFO'

      - name: Upload Built PPL
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lv_icon_x64_v${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}.${{ steps.version.outputs.build }}+g${{ github.sha }}
          path: builds/*.lvlibp
          retention-days: 7

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build-logs/*.log
          retention-days: 3
